---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-deployment3
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp3
  template:
    metadata:
      labels:
        app: myapp3
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-service3
  namespace: default
spec:
  selector:
    app: myapp3
  ports:
    - port: 80
      targetPort: 80
